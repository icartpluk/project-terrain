
name: Simulation tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run simulation unit tests
        run: python -m unittest discover -s simulation -v

      - name: Run 100 seeded simulation trials
        run: python simulation/batch.py --trials 100 --seed 20261030 --output results

      - name: Generate response-delay comparison report
        run: python simulation/compare.py --maps 10 --output results/delay-comparison

      - name: Check animation playback controller
        run: |
          python simulation/animate.py
          node simulation/test_replay.cjs

      - name: Check Windows demo launcher without opening a browser
        if: runner.os == 'Windows'
        run: .\START-DEMO.bat --no-open

